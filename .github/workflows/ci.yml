# =====================================================================
# CI 流水线（GitHub Actions）
#
# 两个阶段：
#   verify：每次推送和 PR 都跑——质量门禁 + 全部测试（含 MySQL / Redis 上的原理实验）
#   image ：只能手动触发——构建镜像、生成 SBOM、漏洞扫描。这是公开的练习仓库，不需要每次推送都构建镜像
# 所有 Action 都固定到 commit SHA 而不是标签：标签可以被改写（属于供应链风险），SHA 不能。
# 行尾注释是版本号，版本只选发布满两周的。
# 这些 SHA 和 action.yml 里的输入参数是 2026-10-27 用 GitHub API 核对过的。
# =====================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 默认只给读权限：流水线被攻破时能做的事情越少越好
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # 有了这两个服务，MysqlLabTest、RedisCacheLabTest 这些原理实验也会在 CI 里跑
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lab
          MYSQL_USER: monolith
          MYSQL_PASSWORD: monolith
          MYSQL_ROOT_PASSWORD: root
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # -C：校验和不匹配就失败（防止依赖在传输或镜像环节被篡改）
      - name: 质量门禁 + 全部测试
        run: ./mvnw -B -C verify
        env:
          LAB_MYSQL_URL: jdbc:mysql://localhost:3307/lab
          LAB_MYSQL_USER: monolith
          LAB_MYSQL_PASSWORD: monolith
      - name: 失败时上传测试报告
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  image:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # 镜像标签用 commit SHA：同一个镜像从测试环境一路推到生产，不重新构建（"一次构建，多处部署"）
      - name: 构建镜像（附带 SBOM 和构建溯源）
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: monolith-app:${{ github.sha }}
          sbom: true
          provenance: true
      - name: 漏洞扫描（有高危漏洞就失败）
        # 踩坑：最初写的是 @0.33.1，这个标签并不存在（真实标签是 v0.33.1），流水线一跑就会失败
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: monolith-app:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
      # 推送到镜像仓库的步骤按团队实际使用的仓库补充
