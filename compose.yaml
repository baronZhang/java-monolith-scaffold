# =====================================================================
# 本地依赖：MySQL + Redis，以及（可选的）应用容器。
#
# 只起数据库和缓存：docker compose up -d mysql redis
# 连同应用一起起：  APP_AUTH_JWT_SECRET=至少32字节的密钥 docker compose --profile app up -d --build
#
# 镜像版本可以用环境变量覆盖：本机连不上 Docker Hub 时，用已经拉过的镜像，例如
#   MYSQL_IMAGE=mysql:8.0.30 docker compose up -d mysql
# =====================================================================
name: java-monolith-scaffold

services:
  mysql:
    # MySQL 8.4 是当前的长期支持版本（LTS）
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_DATABASE: monolith
      MYSQL_USER: monolith
      MYSQL_PASSWORD: monolith
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 映射到本机 3307：避开本机可能已经装了的 MySQL（3306）
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      # 映射到本机 6380：避开本机可能已经在跑的 Redis（6379）。
      # 注意 redis profile 默认连 6379（本机 Redis），用这里的 Redis 时要设 REDIS_PORT=6380
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # 只有加 --profile app 时才启动：构建它需要从 Docker Hub 拉 JDK 基础镜像
    profiles: ["app"]
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 没设置时应用启动失败（JwtConfiguration 要求至少 32 字节）。
      # 不用 ${VAR:?} 在 compose 层校验：compose 会对所有服务做变量替换，包括没启用的 profile，
      # 那样连 "docker compose up -d mysql" 都会报错（实际踩过）
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 优雅停机：docker stop 先发 SIGTERM，给应用 30 秒处理完手上的请求，超时才强制杀掉
    stop_grace_period: 30s

volumes:
  mysql-data:
